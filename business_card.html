<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Elina Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    padding: 20px;
  }

  /* ── Desktop: horizontal ── */
  .card {
    width: 100%;
    max-width: 860px;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    border-radius: 18px;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #c9a96e, #e8d5a3, #c9a96e, transparent);
    z-index: 10;
  }

  /* Photo section desktop */
  .photo-section {
    width: 300px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .photo-section img {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* desktop image */
  .photo-section img.desktop-img {
    display: block;
    object-fit: cover;
    object-position: center top;
    height: 100%;
    width: 100%;
  }

  /* mobile image hidden on desktop */
  .photo-section img.mobile-img {
    display: none;
  }

  .photo-section::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 55%, #0d1117 100%);
    pointer-events: none;
  }

  .content-section {
    flex: 1;
    padding: 44px 44px 36px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand-tag {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #c9a96e;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 600;
    color: #f0ece4;
    line-height: 1.0;
    margin-bottom: 8px;
  }

  .name-sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 19px;
    color: #c9a96e;
    margin-bottom: 18px;
    opacity: 0.9;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, #c9a96e, transparent);
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #8b9ab0;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .contact-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .contact-icon {
    width: 32px; height: 32px;
    border: 1px solid rgba(201,169,110,0.5);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .contact-icon svg { width: 13px; height: 13px; fill: #c9a96e; }

  .contact-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #8fa4be;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }

  .contact-value {
    font-size: 15px;
    color: #f0ece4;
    font-weight: 500;
    display: block;
  }

  .bg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 75% 20%, rgba(201,169,110,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  /* ── Mobile: vertical ── */
  @media (max-width: 580px) {
    body {
      padding: 14px;
      align-items: flex-start;
      padding-top: 24px;
    }

    .card {
      flex-direction: column;
      border-radius: 16px;
      max-width: 100%;
    }

    .photo-section {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* hide desktop tall image, show wide mobile image */
    .photo-section img.desktop-img {
      display: none;
    }

    .photo-section img.mobile-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* bottom fade */
    .photo-section::after {
      background: linear-gradient(to bottom, transparent 60%, #0d1117 100%);
      height: 100%;
    }

    .content-section {
      padding: 20px 20px 28px 20px;
    }

    .brand-tag { font-size: 8px; letter-spacing: 3px; margin-bottom: 10px; }
    .name { font-size: 36px; }
    .name-sub { font-size: 15px; margin-bottom: 14px; }
    .divider { margin-bottom: 12px; }
    .tagline { font-size: 8.5px; letter-spacing: 1.5px; margin-bottom: 18px; }
    .contact-grid { gap: 15px; }
    .contact-label { font-size: 9px; }
    .contact-value { font-size: 14px; }
    .contact-icon { width: 28px; height: 28px; }
    .contact-icon svg { width: 11px; height: 11px; }
  }
</style>
</head>
