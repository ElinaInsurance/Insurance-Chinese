<title>Elina Business Card</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a1a;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 860px;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    border-radius: 18px;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: row;
    flex-direction: row;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #c9a96e, #e8d5a3, #c9a96e, transparent);
    z-index: 10;
  }

  .photo-section::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 55%, #0d1117 100%);
  }

  .content-section {
    -webkit-flex: 1;
    flex: 1;
    padding: 44px 44px 36px 36px;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    position: relative;
  }

  .brand-tag {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #c9a96e;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 600;
    color: #f0ece4;
    line-height: 1.0;
    margin-bottom: 8px;
  }

  .name-sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 19px;
    color: #c9a96e;
    margin-bottom: 18px;
    opacity: 0.9;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, #c9a96e, transparent);
    margin-bottom: 14px;
  }

  .tagline {
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #8b9ab0;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .contact-grid {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 14px;
  }

  .contact-item {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    gap: 14px;
  }

  .contact-icon {
    width: 32px; height: 32px;
    border: 1px solid rgba(201,169,110,0.5);
    border-radius: 50%;
    display: -webkit-flex;
